version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor/patch dev-tool updates instead of one per package.
      dev-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
    labels: ['dependencies']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns: ['*']
    labels: ['dependencies']
